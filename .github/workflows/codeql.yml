# CodeQL code security scanning for JavaScript/TypeScript and Python.
# https://docs.github.com/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Mondays ~09:00 UTC. Catches new vulnerability variants in existing code.
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      # Autobuild is fine for JS/TS (npm install in frontend).
      # For Python we disable autobuild and build manually with pip so CodeQL
      # can trace dependencies WITHOUT pulling the multi-GB torch package.
      - name: Autobuild
        if: matrix.language != 'python'
        uses: github/codeql-action/autobuild@v4

      - name: Build Python (lightweight)
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          # Install only lightweight, traceable deps; skip torch/transformers.
          pip install fastapi uvicorn[standard] pillow sqlalchemy python-dotenv

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

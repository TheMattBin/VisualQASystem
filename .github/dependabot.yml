# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "main"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    # Ignore major bumps that are currently incompatible or ship vulnerable
    # transitive deps. Revisit when the ecosystem catches up:
    #  - typescript 7.x: typescript-eslint does not support TS 7 yet
    #  - next 16.x: pulls sharp@0.34.x with high-severity libvips CVEs
    #  - eslint-config-next 16.x: requires the above (next 16 / TS 7)
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  # Backend pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "main"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "main"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
